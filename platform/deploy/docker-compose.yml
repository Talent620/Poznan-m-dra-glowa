# Fundament infrastruktury dla v2 (lokalny development).
# Uruchom:  docker compose -f platform/deploy/docker-compose.yml up -d
# Produkcyjnie: managed Postgres + Redis (HA) lub k8s/helm (deploy/helm).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diag
      POSTGRES_USER: diag
      POSTGRES_PASSWORD: change-me-in-env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diag"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Szkielety aplikacji (budowane w kolejnych milestone'ach M1–M3):
  # control-plane:  build: ../apps/control-plane   # NestJS REST+gRPC
  # relay:          build: ../apps/relay           # Go data-plane
  # web:            build: ../apps/web             # Next.js

volumes:
  pgdata:
  redisdata:
