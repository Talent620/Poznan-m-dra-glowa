<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{{BRAND}} — dostep</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 100%);
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 380px; background: #fff; color: #1f2937;
      border-radius: 16px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .logo {
      width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 16px;
      background: linear-gradient(135deg, #2563eb, #7c3aed); display: grid;
      place-items: center; color: #fff; font-size: 26px; font-weight: 800;
    }
    h1 { font-size: 20px; text-align: center; margin: 0 0 4px; }
    p.sub { text-align: center; color: #6b7280; font-size: 13px; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px;
      font-size: 15px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #6d28d9; box-shadow: 0 0 0 3px rgba(109,40,217,.15); }
    button {
      width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    button:hover { opacity: .92; }
    .error {
      background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
      border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px;
    }
    .foot { text-align: center; color: #9ca3af; font-size: 11px; margin-top: 20px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login" autocomplete="off">
    <div class="logo">R</div>
    <h1>{{BRAND}}</h1>
    <p class="sub">Wpisz wspolne haslo, aby uzyskac dostep do narzedzia.</p>
    {{ERROR}}
    <label for="password">Haslo dostepu</label>
    <input id="password" name="password" type="password" autofocus required
           placeholder="••••••••" />
    <button type="submit">Wejdz</button>
    <div class="foot">Polaczenie szyfrowane • dostep bez zakladania konta</div>
  </form>
</body>
</html>
