<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>{{BRAND}}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #312e81 100%); color: #e2e8f0;
      padding: 24px; text-align: center;
    }
    .box { max-width: 520px; }
    .logo {
      width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #2563eb, #7c3aed); display: grid;
      place-items: center; color: #fff; font-size: 30px; font-weight: 800;
    }
    h1 { font-size: 28px; margin: 0 0 10px; }
    p { color: #94a3b8; line-height: 1.6; }
    .mode {
      margin-top: 24px; padding: 14px 16px; border-radius: 12px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      font-size: 14px; color: #cbd5e1;
    }
    a.logout { display: inline-block; margin-top: 24px; color: #a5b4fc; font-size: 13px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">R</div>
    <h1>{{BRAND}}</h1>
    <p>Brama dziala poprawnie. Jestes zalogowany wspolnym haslem.</p>
    <div class="mode">{{MODE}}</div>
    <a class="logout" href="/logout">Wyloguj sie</a>
  </div>
</body>
</html>
